<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#1d2152"/>
      <stop offset="55%" stop-color="#0e1030"/>
      <stop offset="100%" stop-color="#04050f"/>
    </radialGradient>
    <radialGradient id="ocean" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#9dd4ff"/>
      <stop offset="55%" stop-color="#225fb5"/>
      <stop offset="100%" stop-color="#08183a"/>
    </radialGradient>
    <radialGradient id="atm" cx="50%" cy="50%" r="55%">
      <stop offset="68%" stop-color="#6ec1ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9bd1ff" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ae89f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5ae89f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc94d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6577" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6577" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globeClip">
      <circle cx="600" cy="335" r="200"/>
    </clipPath>
  </defs>

  <!-- Space backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80"  cy="60"  r="1.4" opacity="0.85"/>
    <circle cx="180" cy="35"  r="0.8" opacity="0.5"/>
    <circle cx="320" cy="90"  r="1.0" opacity="0.7"/>
    <circle cx="440" cy="55"  r="0.9" opacity="0.6"/>
    <circle cx="540" cy="25"  r="1.1" opacity="0.7"/>
    <circle cx="760" cy="40"  r="1.2" opacity="0.8"/>
    <circle cx="900" cy="80"  r="0.9" opacity="0.6"/>
    <circle cx="1050" cy="45" r="1.0" opacity="0.7"/>
    <circle cx="1140" cy="100" r="0.8" opacity="0.5"/>
    <circle cx="40"  cy="280" r="0.9" opacity="0.6"/>
    <circle cx="1160" cy="320" r="1.1" opacity="0.7"/>
    <circle cx="60"  cy="500" r="1.0" opacity="0.7"/>
    <circle cx="200" cy="555" r="0.8" opacity="0.5"/>
    <circle cx="1020" cy="540" r="1.0" opacity="0.7"/>
    <circle cx="1150" cy="500" r="0.9" opacity="0.6"/>
  </g>

  <!-- Globe -->
  <g>
    <!-- atmosphere glow -->
    <circle cx="600" cy="335" r="240" fill="url(#atm)"/>
    <!-- ocean sphere -->
    <circle cx="600" cy="335" r="200" fill="url(#ocean)"/>
    <!-- continents clipped to the globe disk -->
    <g clip-path="url(#globeClip)" fill="#2f7a4e" opacity="0.8">
      <!-- Americas blob -->
      <path d="M460 230 Q485 195 520 210 Q545 225 540 270 Q555 310 525 340 Q495 360 475 340 Q455 320 460 285 Z"/>
      <!-- South America -->
      <path d="M510 360 Q535 365 545 410 Q540 460 510 480 Q495 460 495 420 Q490 380 510 360 Z"/>
      <!-- Africa -->
      <path d="M610 270 Q640 270 650 305 Q660 360 635 410 Q615 425 600 405 Q590 365 595 320 Q598 285 610 270 Z"/>
      <!-- Europe -->
      <path d="M600 245 Q625 235 645 245 Q650 260 625 270 Q605 268 600 255 Z"/>
      <!-- Asia -->
      <path d="M650 245 Q700 230 740 250 Q760 275 745 305 Q725 320 685 310 Q660 295 650 270 Z"/>
      <!-- Australia -->
      <path d="M720 395 Q750 390 765 410 Q765 425 740 432 Q715 425 715 410 Z"/>
    </g>
    <!-- specular highlight -->
    <ellipse cx="535" cy="265" rx="55" ry="22" fill="#ffffff" opacity="0.22"/>

    <!-- Country traffic lights — placed on real-ish coordinates -->
    <!-- Costa Rica (green, the only one on the globe) -->
    <circle cx="486" cy="345" r="22" fill="url(#halo-green)"/>
    <circle cx="486" cy="345" r="6"  fill="#5ae89f"/>
    <!-- USA (yellow) -->
    <circle cx="475" cy="278" r="20" fill="url(#halo-yellow)"/>
    <circle cx="475" cy="278" r="6"  fill="#ffc94d"/>
    <!-- Brazil (yellow) -->
    <circle cx="525" cy="420" r="20" fill="url(#halo-yellow)"/>
    <circle cx="525" cy="420" r="6"  fill="#ffc94d"/>
    <!-- France (yellow) -->
    <circle cx="615" cy="262" r="18" fill="url(#halo-yellow)"/>
    <circle cx="615" cy="262" r="5"  fill="#ffc94d"/>
    <!-- Norway (yellow) -->
    <circle cx="620" cy="232" r="16" fill="url(#halo-yellow)"/>
    <circle cx="620" cy="232" r="5"  fill="#ffc94d"/>
    <!-- South Africa (yellow) -->
    <circle cx="635" cy="430" r="18" fill="url(#halo-yellow)"/>
    <circle cx="635" cy="430" r="5"  fill="#ffc94d"/>
    <!-- Saudi Arabia (red) -->
    <circle cx="660" cy="312" r="20" fill="url(#halo-red)"/>
    <circle cx="660" cy="312" r="6"  fill="#ff6577"/>
    <!-- Russia (red) -->
    <circle cx="700" cy="240" r="20" fill="url(#halo-red)"/>
    <circle cx="700" cy="240" r="6"  fill="#ff6577"/>
    <!-- India (red) -->
    <circle cx="715" cy="315" r="20" fill="url(#halo-red)"/>
    <circle cx="715" cy="315" r="6"  fill="#ff6577"/>
    <!-- Indonesia (red) -->
    <circle cx="730" cy="390" r="18" fill="url(#halo-red)"/>
    <circle cx="730" cy="390" r="5"  fill="#ff6577"/>
    <!-- China (yellow) -->
    <circle cx="735" cy="282" r="20" fill="url(#halo-yellow)"/>
    <circle cx="735" cy="282" r="6"  fill="#ffc94d"/>
    <!-- Australia (yellow) -->
    <circle cx="735" cy="420" r="18" fill="url(#halo-yellow)"/>
    <circle cx="735" cy="420" r="5"  fill="#ffc94d"/>
  </g>

  <!-- Title block, centered -->
  <g font-family="Lato, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="600" y="88" font-size="60" font-weight="900">planetearth.live</text>
    <text x="600" y="125" font-size="20" font-weight="600" fill="#9dd4ff">THE LIVE STATE OF OUR PLANET</text>
  </g>

  <!-- Bottom legend + sources -->
  <g font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
    <!-- legend -->
    <g transform="translate(600 568)" text-anchor="start">
      <g transform="translate(-230 0)">
        <circle cx="0" cy="-5" r="6" fill="#5ae89f"/>
        <text x="14" y="0" font-size="16" font-weight="600" fill="#e8eaff">on track</text>
      </g>
      <g transform="translate(-80 0)">
        <circle cx="0" cy="-5" r="6" fill="#ffc94d"/>
        <text x="14" y="0" font-size="16" font-weight="600" fill="#e8eaff">mixed signal</text>
      </g>
      <g transform="translate(105 0)">
        <circle cx="0" cy="-5" r="6" fill="#ff6577"/>
        <text x="14" y="0" font-size="16" font-weight="600" fill="#e8eaff">major gaps</text>
      </g>
    </g>
    <text x="600" y="608" font-size="13" font-weight="500" fill="#7a8bb8" text-anchor="middle">
      NOAA · NASA · USGS · COPERNICUS · OWID · CLIMATE ACTION TRACKER · IUCN · UNFCCC
    </text>
  </g>
</svg>
